<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集 · Portfolio</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #060b18;
      color: #e8e8e8;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ══════════════════════════════
       Hero / Header with Starfield
    ══════════════════════════════ */
    .hero {
      position: relative;
      text-align: center;
      padding: 80px 20px 50px;
      overflow: hidden;
      background: linear-gradient(180deg, #050a14 0%, #0a1628 60%, #060b18 100%);
    }
    .hero canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #f6d365 0%, #d4a030 40%, #fceabb 60%, #d4a030 100%);
      background-size: 200% 200%;
      animation: goldShimmer 4s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
    @keyframes goldShimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .hero p {
      margin-top: 14px;
      color: rgba(212, 160, 48, 0.6);
      font-size: 0.95rem;
      letter-spacing: 3px;
    }
    .hero-divider {
      display: block;
      width: 60px;
      height: 2px;
      margin: 22px auto 0;
      background: linear-gradient(90deg, transparent, #d4a030, transparent);
      border: none;
    }

    /* ── Filter Tabs ── */
    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px 20px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 11, 24, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 160, 48, 0.08);
    }
    .filter-btn {
      padding: 8px 22px;
      border: 1px solid #1e2a42;
      border-radius: 999px;
      background: transparent;
      color: #7a8ba8;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }
    .filter-btn:hover {
      border-color: #d4a030;
      color: #f6d365;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #d4a030, #f6d365);
      border-color: transparent;
      color: #0a1628;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(212, 160, 48, 0.25);
    }

    /* ── Placeholder for missing images ── */
    .card-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1525 0%, #162038 100%);
      color: #3a4a62;
      font-size: 0.8rem;
      text-align: center;
      padding: 20px;
      gap: 8px;
    }
    .card-placeholder strong { color: #f6d365; font-size: 1.2rem; }
    .card-placeholder span { color: #a9b5c9; }
    [hidden] { display: none !important; }
    .image-button { display: block; width: 100%; padding: 0; border: 0; background: none; }
    button:focus-visible { outline: 2px solid #f6d365; outline-offset: -4px; }

    /* ── Grid ── */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ── Card with scroll reveal ── */
    .card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #0d1525;
      border: 1px solid #162038;
      transition: transform 0.4s cubic-bezier(.25,.46,.45,.94),
                  box-shadow 0.4s ease,
                  border-color 0.3s ease;
      opacity: 1;
    }
    .card.revealed {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s cubic-bezier(.25,.46,.45,.94),
                  transform 0.6s cubic-bezier(.25,.46,.45,.94),
                  box-shadow 0.4s ease,
                  border-color 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55),
                  0 0 30px rgba(212, 160, 48, 0.06);
      border-color: rgba(212, 160, 48, 0.2);
    }
    .card.hidden { display: none; }

    /* ── Card image with hover zoom ── */
    .card-img-wrap {
      overflow: hidden;
      position: relative;
    }
    .card-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #111a2e;
      transition: transform 0.5s cubic-bezier(.25,.46,.45,.94);
      cursor: pointer;
    }
    .card:hover .card-img {
      transform: scale(1.06);
    }
    .card-body {
      padding: 16px 18px 18px;
    }
    .card-category {
      display: inline-block;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(212, 160, 48, 0.1);
      color: #d4a030;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e0ddd5;
    }
    .card-desc {
      font-size: 0.82rem;
      color: #6b7a92;
      line-height: 1.5;
    }

    /* ══════════════════════════════
       Lightbox
    ══════════════════════════════ */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(2, 5, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      cursor: default;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .lightbox-overlay.open img {
      opacity: 1;
      transform: scale(1);
    }
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(6, 11, 24, 0.7);
      color: #ccc;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      z-index: 2001;
    }
    .lightbox-close:hover { background: rgba(212, 160, 48, 0.3); color: #f6d365; }
    .lightbox-title {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-align: center;
      pointer-events: none;
    }



    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 40px 20px 30px;
      color: #3a4a62;
      font-size: 0.8rem;
      border-top: 1px solid #111a2e;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .hero h1 { font-size: 1.8rem; letter-spacing: 3px; }
      .hero { padding: 60px 20px 36px; }
      .works-grid { grid-template-columns: 1fr; padding: 0 16px 40px; }
      .filter-btn { padding: 6px 16px; font-size: 0.82rem; }
    }
    .admin-panel { max-width: 720px; margin: 24px auto; padding: 24px; background: #0d1525; border: 1px solid #293753; border-radius: 14px; }
    .admin-panel h2 { color: #f6d365; margin-bottom: 16px; }
    .admin-panel label { display: block; margin: 14px 0; }
    .admin-panel input, .admin-panel select, .admin-panel textarea { display: block; width: 100%; margin-top: 6px; padding: 12px; font: inherit; background: #060b18; color: #e8e8e8; border: 1px solid #465573; border-radius: 6px; }
    .admin-panel button, footer button { padding: 10px 18px; background: #f6d365; color: #060b18; border: 0; border-radius: 6px; font: inherit; cursor: pointer; margin: 8px 8px 8px 0; }
    button:disabled { opacity: .55; cursor: wait; }
    .notice { max-width: 720px; margin: 16px auto; padding: 0 20px; color: #b5c1d5; }
    #preview { max-width: 100%; max-height: 220px; margin: 16px 0; }
    @media (max-width: 640px) { .admin-panel { margin: 16px; padding: 20px; } }
  </style>
</head>
<body>

  <!-- ── Hero with animated starfield ── -->
  <header class="hero" id="hero">
    <canvas id="starfield"></canvas>
    <div class="hero-content">
      <h1>作 品 集</h1>
      <p>节目单 · 平面设计 · 概念设计 · PPT · 摄影</p>
      <hr class="hero-divider" />
    </div>
  </header>

  <!-- ── Category Filter Tabs ── -->
  <nav class="filter-bar" id="filterBar" aria-label="作品分类">
    <button class="filter-btn active" data-category="all" aria-pressed="true">全部</button>
    <button class="filter-btn" data-category="节目单">节目单</button>
    <button class="filter-btn" data-category="海报">海报</button>
    <button class="filter-btn" data-category="概念设计">概念设计</button>
    <button class="filter-btn" data-category="PPT">PPT</button>
    <button class="filter-btn" data-category="摄影">摄影</button>
  </nav>

  <p id="backendStatus" class="notice" role="status" aria-live="polite"></p>
  <section id="adminPanel" class="admin-panel" hidden aria-label="作品管理">
    <h2>作品管理</h2>
    <form id="loginForm">
      <label>邮箱<input name="email" type="email" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
    <form id="workForm" hidden>
      <label>操作<select name="project"><option value="">新增作品</option></select></label>
      <label>作品标题<input name="title" required maxlength="80"></label>
      <label>分类<select name="category"><option>节目单</option><option>海报</option><option>概念设计</option><option>PPT</option><option>摄影</option></select></label>
      <label>作品介绍<textarea name="description" maxlength="1000" rows="3"></textarea></label>
      <label>图片（JPG / PNG / WebP，最大 8 MB）<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <p>新增作品需要图片；编辑已有作品时，不选图片会保留原图。</p>
      <img id="preview" alt="待上传图片预览" hidden>
      <button type="submit">发布作品</button><button type="button" id="logoutButton">退出登录</button>
    </form>
    <p id="adminStatus" role="status" aria-live="polite"></p>
  </section>
  <!-- ── Works Grid ── -->
  <main class="works-grid" id="worksGrid" aria-label="Works 作品">
    <article class="card" data-category="节目单">
      <div class="card-img-wrap" data-image="images/singer-contest-program-2026.jpg">
        <div class="card-placeholder"><strong>十佳歌手节目单 2026</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">节目单</span><h2 class="card-title">十佳歌手节目单 2026</h2></div>
    </article>
    <article class="card" data-category="概念设计">
      <div class="card-img-wrap" data-image="images/misty-hangzhou-poker.jpg">
        <div class="card-placeholder"><strong>烟雨杭州扑克概念</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">概念设计</span><h2 class="card-title">烟雨杭州扑克概念</h2></div>
    </article>
    <article class="card" data-category="海报">
      <div class="card-img-wrap" data-image="images/birthday-raffle-ticket.jpg">
        <div class="card-placeholder"><strong>生日抽奖券</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">海报</span><h2 class="card-title">生日抽奖券</h2></div>
    </article>
    <article class="card" data-category="概念设计">
      <div class="card-img-wrap" data-image="images/college-emblem-redraw.jpg">
        <div class="card-placeholder"><strong>院徽重绘</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">概念设计</span><h2 class="card-title">院徽重绘</h2></div>
    </article>
    <article class="card" data-category="PPT">
      <div class="card-img-wrap" data-image="images/information-huazhang-ppt.jpg">
        <div class="card-placeholder"><strong>信息华章 PPT</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">PPT</span><h2 class="card-title">信息华章 PPT</h2></div>
    </article>
    <article class="card" data-category="摄影">
      <div class="card-img-wrap" data-image="images/photography.jpg">
        <div class="card-placeholder"><strong>摄影作品</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">摄影</span><h2 class="card-title">摄影作品</h2></div>
    </article>
  </main>

  <!-- ── Lightbox ── -->
  <div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="作品大图" tabindex="-1">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭大图">✕</button>
    <img id="lightboxImg" alt="" />
    <div class="lightbox-title" id="lightboxTitle"></div>
  </div>




  <footer>
    <button id="adminToggle" aria-expanded="false" aria-controls="adminPanel">管理作品</button>
    <p>&copy; 2026 作品集 · All rights reserved.</p>
  </footer>

<script type="module">
  import { backendConfig } from './config.js';
  import { PortfolioAPI } from './backend-client.js';
  // ════════════════════════════════════════
  //  Animated Starfield (Canvas)
  // ════════════════════════════════════════
  (function initStarfield() {
    const canvas = document.getElementById("starfield");
    const ctx    = canvas.getContext("2d");
    const hero   = document.getElementById("hero");
    let stars = [];
    const STAR_COUNT = 160;

    function resize() {
      const rect = hero.getBoundingClientRect();
      canvas.width  = rect.width  * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      canvas.style.width  = rect.width  + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function seed() {
      const w = canvas.width / devicePixelRatio;
      const h = canvas.height / devicePixelRatio;
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.4 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.005 + 0.002,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    let t = 0;
    function draw() {
      const w = canvas.width / devicePixelRatio;
      const h = canvas.height / devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      t += 1;
      for (const s of stars) {
        const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 200, 160, ${a})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    resize(); seed(); draw();
    window.addEventListener("resize", () => { resize(); seed(); });
  })();

  // All artwork is loaded from repository files, relative to this page.
  const grid = document.getElementById("worksGrid");
  const filterBar = document.getElementById("filterBar");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxTitle = document.getElementById("lightboxTitle");
  const lightboxClose = document.getElementById("lightboxClose");
  let previousFocus;

  function loadImages() { grid.querySelectorAll("[data-image]").forEach(wrap => {
    const title = wrap.closest(".card").querySelector(".card-title").textContent;
    const img = new Image();
    img.className = "card-img";
    img.alt = title;
    img.onload = () => {
      const button = document.createElement("button");
      button.className = "image-button";
      button.setAttribute("aria-label", "查看大图：" + title);
      button.append(img);
      button.addEventListener("click", () => {
        previousFocus = button;
        lightboxImg.src = img.src;
        lightboxImg.alt = title;
        lightboxTitle.textContent = title;
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
        lightboxClose.focus();
      });
      wrap.replaceChildren(button);
    };
    // Missing artwork keeps the existing placeholder visible.
    img.onerror = () => { img.remove(); };
    img.src = wrap.dataset.image;
  }); }
  loadImages();

  filterBar.addEventListener("click", event => {
    const button = event.target.closest(".filter-btn");
    if (!button) return;
    filterBar.querySelectorAll(".filter-btn").forEach(item => {
      item.classList.toggle("active", item === button);
      item.setAttribute("aria-pressed", String(item === button));
    });
    applyFilter();
  });
  filterBar.querySelectorAll(".filter-btn:not(.active)").forEach(button => button.setAttribute("aria-pressed", "false"));

  function applyFilter() {
    const category = filterBar.querySelector('.active').dataset.category;
    grid.querySelectorAll('.card').forEach(card => { card.hidden = category !== 'all' && card.dataset.category !== category; });
  }
  const api = backendConfig.url && backendConfig.publicKey ? new PortfolioAPI(backendConfig) : null;
  const panel = document.getElementById('adminPanel');
  const toggle = document.getElementById('adminToggle');
  const login = document.getElementById('loginForm');
  const form = document.getElementById('workForm');
  const status = document.getElementById('adminStatus');
  const backendStatus = document.getElementById('backendStatus');
  if (!api) login.querySelectorAll('input,button').forEach(element => element.disabled = true);
  let projects = [];
  let busy = false;
  let previewURL;
  toggle.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    toggle.setAttribute('aria-expanded', String(!panel.hidden));
    if (!api) status.textContent = '管理功能尚未连接，请先完成后端配置。';
    if (!panel.hidden) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  function setBusy(value) {
    busy = value;
    panel.querySelectorAll('input,select,textarea,button').forEach(el => el.disabled = value);
  }
  function clearPreview() {
    if (previewURL) URL.revokeObjectURL(previewURL);
    previewURL = null;
    const preview = document.getElementById('preview');
    preview.removeAttribute('src'); preview.hidden = true;
  }
  function selectProject() {
    const project = projects.find(p => p.id === form.elements.project.value);
    form.elements.title.value = project?.title || '';
    form.elements.category.value = project?.category || '节目单';
    form.elements.description.value = project?.description || '';
    form.elements.image.value = ''; clearPreview();
  }
  form.elements.project.addEventListener('change', selectProject);
  form.elements.image.addEventListener('change', () => {
    clearPreview();
    const file = form.elements.image.files[0];
    if (!file) return;
    if (!['image/jpeg','image/png','image/webp'].includes(file.type) || file.size > 8388608) {
      status.textContent = '请选择 8 MB 以内的 JPG、PNG 或 WebP 图片'; form.elements.image.value = ''; return;
    }
    previewURL = URL.createObjectURL(file);
    const preview = document.getElementById('preview'); preview.src = previewURL; preview.hidden = false;
  });
  async function refreshProjects() {
    const rows = await api.list();
    projects = rows;
    const cards = rows.map(project => {
      const card = document.createElement('article'); card.className = 'card'; card.dataset.category = project.category;
      const wrap = document.createElement('div'); wrap.className = 'card-img-wrap';
      const imageURL = api.imageURL(project);
      // Only trusted storage URLs or repository image paths may become image sources.
      if (imageURL && (imageURL.startsWith(api.url + '/storage/v1/object/public/portfolio/') || /^images\/[a-zA-Z0-9._-]+$/.test(imageURL))) wrap.dataset.image = imageURL;
      const placeholder = document.createElement('div'); placeholder.className = 'card-placeholder';
      const heading = document.createElement('strong'); heading.textContent = project.title;
      const hint = document.createElement('span'); hint.textContent = '图片待补充'; placeholder.append(heading, hint); wrap.append(placeholder);
      const body = document.createElement('div'); body.className = 'card-body';
      const category = document.createElement('span'); category.className = 'card-category'; category.textContent = project.category;
      const title = document.createElement('h2'); title.className = 'card-title'; title.textContent = project.title;
      const desc = document.createElement('p'); desc.className = 'card-desc'; desc.textContent = project.description;
      body.append(category, title, desc); card.append(wrap, body); return card;
    });
    grid.replaceChildren(...cards); loadImages(); applyFilter();
    form.elements.project.replaceChildren(new Option('新增作品', ''), ...rows.map(p => new Option(p.title, p.id)));
  }
  login.addEventListener('submit', async event => {
    event.preventDefault(); if (!api || busy) return;
    setBusy(true); status.textContent = '正在登录…';
    try {
      await api.login(login.elements.email.value.trim(), login.elements.password.value);
      await refreshProjects(); login.reset(); login.hidden = true; form.hidden = false; status.textContent = '已登录，可以发布作品。';
    } catch (error) { status.textContent = error.message; }
    finally { setBusy(false); }
  });
  document.getElementById('logoutButton').addEventListener('click', async () => {
    if (busy) return; setBusy(true);
    try { await api.logout(); status.textContent = '已退出登录'; }
    catch { status.textContent = '本机已退出；服务器会话撤销失败，请稍后重试。'; }
    finally { form.reset(); clearPreview(); form.hidden = true; login.hidden = false; setBusy(false); }
  });
  form.addEventListener('submit', async event => {
    event.preventDefault(); if (!api || busy) return;
    const values = { id: form.elements.project.value, title: form.elements.title.value, category: form.elements.category.value, description: form.elements.description.value, file: form.elements.image.files[0] };
    setBusy(true); status.textContent = '正在上传并发布，请勿关闭页面…';
    let published = false;
    try {
      const saved = await api.save(values);
      if (!saved?.length) throw new Error('作品未保存，请检查管理员权限后重试');
      published = true; form.reset(); clearPreview(); await refreshProjects(); status.textContent = '发布成功，访客刷新页面即可看到作品。';
    } catch (error) { status.textContent = published ? '发布已成功，但列表刷新失败。请刷新页面，不要重复发布。' : error.message; }
    finally { setBusy(false); }
  });
  if (api) {
    backendStatus.textContent = '正在加载作品…';
    refreshProjects().then(() => { backendStatus.textContent = projects.length ? '' : '暂时还没有作品。'; })
      .catch(() => { backendStatus.textContent = '在线作品暂时加载失败，当前展示静态作品。请刷新重试。'; });
  }
  window.addEventListener('beforeunload', event => { if (busy) { event.preventDefault(); event.returnValue = ''; } });

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.removeAttribute("src");
    document.body.style.overflow = "";
    previousFocus?.focus();
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("open")) return;
    if (event.key === "Escape") closeLightbox();
    if (event.key === "Tab") { event.preventDefault(); lightboxClose.focus(); }
  });
</script>

</body>
</html>
