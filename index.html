<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集 · Portfolio</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #060b18;
      color: #e8e8e8;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ══════════════════════════════
       Hero / Header with Starfield
    ══════════════════════════════ */
    .hero {
      position: relative;
      text-align: center;
      padding: 80px 20px 50px;
      overflow: hidden;
      background: linear-gradient(180deg, #050a14 0%, #0a1628 60%, #060b18 100%);
    }
    .hero canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #f6d365 0%, #d4a030 40%, #fceabb 60%, #d4a030 100%);
      background-size: 200% 200%;
      animation: goldShimmer 4s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
    @keyframes goldShimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .hero p {
      margin-top: 14px;
      color: rgba(212, 160, 48, 0.6);
      font-size: 0.95rem;
      letter-spacing: 3px;
    }
    .hero-divider {
      display: block;
      width: 60px;
      height: 2px;
      margin: 22px auto 0;
      background: linear-gradient(90deg, transparent, #d4a030, transparent);
      border: none;
    }

    /* ── Filter Tabs ── */
    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px 20px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 11, 24, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 160, 48, 0.08);
    }
    .filter-btn {
      padding: 8px 22px;
      border: 1px solid #1e2a42;
      border-radius: 999px;
      background: transparent;
      color: #7a8ba8;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }
    .filter-btn:hover {
      border-color: #d4a030;
      color: #f6d365;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #d4a030, #f6d365);
      border-color: transparent;
      color: #0a1628;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(212, 160, 48, 0.25);
    }

    /* ── Placeholder for missing images ── */
    .card-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1525 0%, #162038 100%);
      color: #3a4a62;
      font-size: 0.8rem;
      text-align: center;
      padding: 20px;
      gap: 8px;
    }
    .card-placeholder strong { color: #f6d365; font-size: 1.2rem; }
    .card-placeholder span { color: #a9b5c9; }
    [hidden] { display: none !important; }
    .image-button { display: block; width: 100%; padding: 0; border: 0; background: none; }
    button:focus-visible { outline: 2px solid #f6d365; outline-offset: -4px; }

    /* ── Grid ── */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ── Card with scroll reveal ── */
    .card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #0d1525;
      border: 1px solid #162038;
      transition: transform 0.4s cubic-bezier(.25,.46,.45,.94),
                  box-shadow 0.4s ease,
                  border-color 0.3s ease;
      opacity: 1;
    }
    .card.revealed {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s cubic-bezier(.25,.46,.45,.94),
                  transform 0.6s cubic-bezier(.25,.46,.45,.94),
                  box-shadow 0.4s ease,
                  border-color 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55),
                  0 0 30px rgba(212, 160, 48, 0.06);
      border-color: rgba(212, 160, 48, 0.2);
    }
    .card.hidden { display: none; }

    /* ── Card image with hover zoom ── */
    .card-img-wrap {
      overflow: hidden;
      position: relative;
    }
    .card-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #111a2e;
      transition: transform 0.5s cubic-bezier(.25,.46,.45,.94);
      cursor: pointer;
    }
    .card:hover .card-img {
      transform: scale(1.06);
    }
    .card-body {
      padding: 16px 18px 18px;
    }
    .card-category {
      display: inline-block;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(212, 160, 48, 0.1);
      color: #d4a030;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e0ddd5;
    }
    .card-desc {
      font-size: 0.82rem;
      color: #6b7a92;
      line-height: 1.5;
    }

    /* ══════════════════════════════
       Lightbox
    ══════════════════════════════ */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(2, 5, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      cursor: default;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .lightbox-overlay.open img {
      opacity: 1;
      transform: scale(1);
    }
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(6, 11, 24, 0.7);
      color: #ccc;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      z-index: 2001;
    }
    .lightbox-close:hover { background: rgba(212, 160, 48, 0.3); color: #f6d365; }
    .lightbox-title {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-align: center;
      pointer-events: none;
    }



    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 40px 20px 30px;
      color: #3a4a62;
      font-size: 0.8rem;
      border-top: 1px solid #111a2e;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .hero h1 { font-size: 1.8rem; letter-spacing: 3px; }
      .hero { padding: 60px 20px 36px; }
      .works-grid { grid-template-columns: 1fr; padding: 0 16px 40px; }
      .filter-btn { padding: 6px 16px; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

  <!-- ── Hero with animated starfield ── -->
  <header class="hero" id="hero">
    <canvas id="starfield"></canvas>
    <div class="hero-content">
      <h1>作 品 集</h1>
      <p>节目单 · 平面设计 · 概念设计 · PPT · 摄影</p>
      <hr class="hero-divider" />
    </div>
  </header>

  <!-- ── Category Filter Tabs ── -->
  <nav class="filter-bar" id="filterBar" aria-label="作品分类">
    <button class="filter-btn active" data-category="all" aria-pressed="true">全部</button>
    <button class="filter-btn" data-category="节目单">节目单</button>
    <button class="filter-btn" data-category="海报">海报</button>
    <button class="filter-btn" data-category="概念设计">概念设计</button>
    <button class="filter-btn" data-category="PPT">PPT</button>
    <button class="filter-btn" data-category="摄影">摄影</button>
  </nav>

  <!-- ── Works Grid ── -->
  <main class="works-grid" id="worksGrid" aria-label="Works 作品">
    <article class="card" data-category="节目单">
      <div class="card-img-wrap" data-image="images/singer-contest-program-2026.jpg">
        <div class="card-placeholder"><strong>十佳歌手节目单 2026</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">节目单</span><h2 class="card-title">十佳歌手节目单 2026</h2></div>
    </article>
    <article class="card" data-category="概念设计">
      <div class="card-img-wrap" data-image="images/misty-hangzhou-poker.jpg">
        <div class="card-placeholder"><strong>烟雨杭州扑克概念</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">概念设计</span><h2 class="card-title">烟雨杭州扑克概念</h2></div>
    </article>
    <article class="card" data-category="海报">
      <div class="card-img-wrap" data-image="images/birthday-raffle-ticket.jpg">
        <div class="card-placeholder"><strong>生日抽奖券</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">海报</span><h2 class="card-title">生日抽奖券</h2></div>
    </article>
    <article class="card" data-category="概念设计">
      <div class="card-img-wrap" data-image="images/college-emblem-redraw.jpg">
        <div class="card-placeholder"><strong>院徽重绘</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">概念设计</span><h2 class="card-title">院徽重绘</h2></div>
    </article>
    <article class="card" data-category="PPT">
      <div class="card-img-wrap" data-image="images/information-huazhang-ppt.jpg">
        <div class="card-placeholder"><strong>信息华章 PPT</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">PPT</span><h2 class="card-title">信息华章 PPT</h2></div>
    </article>
    <article class="card" data-category="摄影">
      <div class="card-img-wrap" data-image="images/photography.jpg">
        <div class="card-placeholder"><strong>摄影作品</strong><span>图片待补充</span></div>
      </div>
      <div class="card-body"><span class="card-category">摄影</span><h2 class="card-title">摄影作品</h2></div>
    </article>
  </main>

  <!-- ── Lightbox ── -->
  <div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="作品大图" tabindex="-1">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭大图">✕</button>
    <img id="lightboxImg" alt="" />
    <div class="lightbox-title" id="lightboxTitle"></div>
  </div>




  <footer>
    <p>&copy; 2026 作品集 · All rights reserved.</p>
  </footer>

<script>
  // ════════════════════════════════════════
  //  Animated Starfield (Canvas)
  // ════════════════════════════════════════
  (function initStarfield() {
    const canvas = document.getElementById("starfield");
    const ctx    = canvas.getContext("2d");
    const hero   = document.getElementById("hero");
    let stars = [];
    const STAR_COUNT = 160;

    function resize() {
      const rect = hero.getBoundingClientRect();
      canvas.width  = rect.width  * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      canvas.style.width  = rect.width  + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function seed() {
      const w = canvas.width / devicePixelRatio;
      const h = canvas.height / devicePixelRatio;
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.4 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.005 + 0.002,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    let t = 0;
    function draw() {
      const w = canvas.width / devicePixelRatio;
      const h = canvas.height / devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      t += 1;
      for (const s of stars) {
        const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 200, 160, ${a})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    resize(); seed(); draw();
    window.addEventListener("resize", () => { resize(); seed(); });
  })();

  // All artwork is loaded from repository files, relative to this page.
  const grid = document.getElementById("worksGrid");
  const filterBar = document.getElementById("filterBar");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxTitle = document.getElementById("lightboxTitle");
  const lightboxClose = document.getElementById("lightboxClose");
  let previousFocus;

  grid.querySelectorAll("[data-image]").forEach(wrap => {
    const title = wrap.closest(".card").querySelector(".card-title").textContent;
    const img = new Image();
    img.className = "card-img";
    img.alt = title;
    img.onload = () => {
      const button = document.createElement("button");
      button.className = "image-button";
      button.setAttribute("aria-label", "查看大图：" + title);
      button.append(img);
      button.addEventListener("click", () => {
        previousFocus = button;
        lightboxImg.src = img.src;
        lightboxImg.alt = title;
        lightboxTitle.textContent = title;
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
        lightboxClose.focus();
      });
      wrap.replaceChildren(button);
    };
    // Missing artwork keeps the existing placeholder visible.
    img.onerror = () => { img.remove(); };
    img.src = wrap.dataset.image;
  });

  filterBar.addEventListener("click", event => {
    const button = event.target.closest(".filter-btn");
    if (!button) return;
    filterBar.querySelectorAll(".filter-btn").forEach(item => {
      item.classList.toggle("active", item === button);
      item.setAttribute("aria-pressed", String(item === button));
    });
    grid.querySelectorAll(".card").forEach(card => {
      card.hidden = button.dataset.category !== "all" && card.dataset.category !== button.dataset.category;
    });
  });
  filterBar.querySelectorAll(".filter-btn:not(.active)").forEach(button => button.setAttribute("aria-pressed", "false"));

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.removeAttribute("src");
    document.body.style.overflow = "";
    previousFocus?.focus();
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("open")) return;
    if (event.key === "Escape") closeLightbox();
    if (event.key === "Tab") { event.preventDefault(); lightboxClose.focus(); }
  });
</script>

</body>
</html>
